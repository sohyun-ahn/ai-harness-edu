# 회귀 평가 CI 예시 (GitHub Actions) — 헤드리스 엔진
# 쓰는 법: 이 파일을 저장소의 .github/workflows/eval.yml 로 복사한다.
# 인증 (둘 중 하나를 Settings → Secrets 에):
#   - CLAUDE_CODE_OAUTH_TOKEN : 구독 계정에서 `claude setup-token` 으로 만든 장기 토큰 (회사 정책 확인 필요)
#   - ANTHROPIC_API_KEY       : API 키
# 수동 실행(workflow_dispatch)만 켜 두었다 — 실행할 때마다 할당량·비용이 든다.
# 기준 결과(baseline)는 미리 한 번 돌려서 lab7_eval_regression/results/baseline_<track>.json 으로 커밋해 둔다.
name: agent-eval

on:
  workflow_dispatch:
    inputs:
      track:
        description: "pangyo | pohang"
        default: "pangyo"
      cases:
        description: "평가할 건수 (0 = 전부)"
        default: "10"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: labs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code
      - name: 평가 스위트 실행
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          python lab7_eval_regression/run_suite.py --engine headless
          --track ${{ inputs.track }} -n ${{ inputs.cases }} --k 2
          --out lab7_eval_regression/results/ci_${{ inputs.track }}.json
      - name: 기준 결과와 비교 (회귀면 실패)
        run: >
          python lab7_eval_regression/compare.py
          lab7_eval_regression/results/baseline_${{ inputs.track }}.json
          lab7_eval_regression/results/ci_${{ inputs.track }}.json
      - name: 보고서 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ inputs.track }}
          path: labs/lab7_eval_regression/results/ci_*
